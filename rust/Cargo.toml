[workspace]
resolver = "2"
members = ["transit-ingest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/thompgt/transit-delay-explorer"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow = "53"
parquet = "53"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
indexmap = "2"

[profile.release]
opt-level = 3
lto = "thin"
