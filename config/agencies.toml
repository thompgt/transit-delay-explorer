# Agency registry. Adding an agency is a config entry, not a code change.
#
# Every field the ingest needs is here: where the static archive lives, which
# realtime feeds to poll, the agency-local timezone used to resolve service
# dates, and the quirks that agency's feed exhibits.
#
# Anything marked DECLARED, UNUSED below is recorded but not yet honoured by any
# code: it describes the realtime path, which is Phase 3. The tests over these
# check that this file parses into the values it states -- not that a parser
# obeys them. Changing one of them today changes nothing.

[defaults]
# DECLARED, UNUSED until Phase 3. Polling interval for realtime feeds. MTA
# regenerates roughly every 30s; polling faster just burns requests for
# identical payloads.
poll_interval_seconds = 30
# DECLARED, UNUSED until Phase 3. A feed whose header timestamp is older than
# this should be treated as stale and raise a health event instead of silently
# producing old data.
stale_after_seconds = 300
# Live: the static-archive download timeout.
request_timeout_seconds = 20
# DECLARED, UNUSED until Phase 5. On-time threshold for the on-time-performance
# measure, which needs realtime arrivals before it can exist.
on_time_threshold_seconds = 300

# ---------------------------------------------------------------------------
# NYC Subway
# ---------------------------------------------------------------------------
[[agency]]
id = "MTA_NYCT"
name = "MTA New York City Transit"
mode = "subway"
timezone = "America/New_York"
static_url = "https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip"

# The subway feed is split across endpoints by trunk line. Each is an
# independent GTFS-RT payload over the same static schedule.
[[agency.realtime]]
name = "ace"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-ace"
[[agency.realtime]]
name = "bdfm"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-bdfm"
[[agency.realtime]]
name = "g"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-g"
[[agency.realtime]]
name = "jz"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-jz"
[[agency.realtime]]
name = "nqrw"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-nqrw"
[[agency.realtime]]
name = "l"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-l"
[[agency.realtime]]
name = "numbered"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs"
[[agency.realtime]]
name = "sir"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-si"

# DECLARED, UNUSED until Phase 3 -- both fields describe realtime id matching,
# and nothing reads a realtime feed yet.
[agency.quirks]
# NYCT realtime trip_ids carry a schedule-run prefix and do not match static
# trip_ids literally; they must be matched on the suffix after the underscore.
trip_id_match = "nyct_suffix"
# NYCT stop_ids in realtime append a direction suffix (N/S) to the parent id.
stop_id_direction_suffix = true

# ---------------------------------------------------------------------------
# Long Island Rail Road
# ---------------------------------------------------------------------------
[[agency]]
id = "MTA_LIRR"
name = "Long Island Rail Road"
mode = "commuter_rail"
timezone = "America/New_York"
static_url = "https://rrgtfsfeeds.s3.amazonaws.com/gtfslirr.zip"

[[agency.realtime]]
name = "lirr"
url = "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/lirr%2Fgtfs-lirr"

[agency.quirks]
trip_id_match = "exact"
stop_id_direction_suffix = false

