name: transit-delay-explorer

# Redpanda instead of Kafka: single binary, no ZooKeeper/KRaft ceremony, same
# wire protocol so the Java service uses the stock Kafka client unchanged.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: tde-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      # INTERNAL is what containers use; EXTERNAL is what the host uses. Both
      # have to be advertised or one side connects and then fails on metadata.
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "19092:19092"   # Kafka API (host)
      - "18081:8081"    # Schema Registry
      - "19644:9644"    # Admin API / metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: tde-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8090:8080"

  # One-shot: creates topics with the partition counts the stream layer expects,
  # then exits. Idempotent, so re-running compose up is safe.
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: tde-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"

  # The Atoti cube and its dashboard.
  #
  # Under a profile because it is not part of the broker stack and starting it
  # unasked would pull a JVM-backed image and bind a port for anyone who only
  # wanted Redpanda:
  #
  #   docker compose -f infra/docker-compose.yml --profile cube up cube
  #
  # The repo is mounted read-only rather than copied in, so editing the cube
  # definition is an edit and a restart rather than an image rebuild. It reads
  # the Parquet the Rust ingest writes; nothing here produces it.
  cube:
    profiles: ["cube"]
    image: tde-cube:latest
    build:
      context: ../python/transit-cube
      dockerfile: Dockerfile
    container_name: tde-cube
    working_dir: /app
    command: ["python", "-m", "transit_cube.serve"]
    environment:
      TDE_DATA_DIR: /app/data
      # Fixed rather than ephemeral: a dashboard whose URL moves on every
      # restart cannot be bookmarked. Atoti's SessionConfig has no host
      # setting -- the server binds every interface -- so publishing the port
      # is all that is needed to reach it from the host.
      TDE_CUBE_PORT: "9090"
      # Optional: comma-separated YYYY-MM-DD service dates. The load prunes at
      # the partition level, so restricting it is the difference between
      # seconds and minutes on a full window.
      # TDE_CUBE_DATES: "2026-05-26,2026-05-27"
      # Dashboards are saved server-side. The repo is mounted read-only, so
      # without a writable location every dashboard would be lost on restart --
      # which for a project whose deliverable *is* the dashboard would be a poor
      # trade for the safety of a read-only mount.
      TDE_CUBE_CONTENT: /var/lib/atoti
    ports:
      # Bound to the loopback interface, not to every interface. Atoti has no
      # authentication in Community Edition and its server binds 0.0.0.0 inside
      # the container, so an unqualified mapping publishes the entire dataset to
      # anyone on the same network -- and on a laptop, that is whatever coffee
      # shop wifi it is on. Set TDE_CUBE_HOST_BIND=0.0.0.0 to expose it
      # deliberately, on a network where that is what you mean.
      #
      # 9090 is also Prometheus's default, so the host side is overridable:
      # TDE_CUBE_HOST_PORT=9095 docker compose ... --profile cube up cube.
      - "${TDE_CUBE_HOST_BIND:-127.0.0.1}:${TDE_CUBE_HOST_PORT:-9090}:9090"
    volumes:
      - ../:/app:ro
      - cube-content:/var/lib/atoti

volumes:
  redpanda-data:
  cube-content:
