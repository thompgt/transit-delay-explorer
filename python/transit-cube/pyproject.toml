[project]
name = "transit-cube"
version = "0.1.0"
description = "Atoti Community Edition cube for Transit Delay Explorer"
requires-python = ">=3.11,<3.13"

# Atoti Community Edition only. No paid licenses anywhere in the stack.
# CE publishes a license that expires periodically, so the pin is a floor with
# an upper bound rather than an exact version -- see docs/WORKPLAN.md risks.
dependencies = [
    "atoti[jupyterlab]>=0.9,<0.10",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
