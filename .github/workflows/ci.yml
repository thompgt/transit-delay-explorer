name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # The ingest has genuinely platform-specific code -- fetch::install deletes
    # before renaming because Windows will not rename onto an existing file --
    # and the dev machine is Windows while CI was Linux only. That is exactly
    # backwards: the branch that exists for one platform was the branch no
    # machine but the author's ever ran.
    name: rust / transit-ingest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Formatting and lint are platform-independent; running them twice would
      # only double the ways one job can be red for one reason.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Tests load the checked-in config/agencies.toml, so a typo there fails
      # here rather than midway through a run.
      - run: cargo test --all-features

  java:
    name: java / transit-stream
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/transit-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn -B verify

  python:
    name: python / transit-cube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/transit-cube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Atoti Community Edition does not support 3.13.
          python-version: '3.11'
      # From pyproject.toml, not from a hand-typed list. CI used to install
      # unpinned pandas and pyarrow while the Dockerfile re-listed its own
      # versions beside a comment admitting they mirrored pyproject -- three
      # copies of one dependency set, any two of which could drift without
      # anything noticing.
      #
      # This pulls Atoti and its bundled JVM, which is slow, and that is the
      # point: it is what makes tests/test_cube.py actually run here rather
      # than skip itself. The loader tests write their own fixture dataset, so
      # no ingest run is required.
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q

  cube-image:
    # The image the cube actually runs as. Nothing built it automatically
    # before, so a Dockerfile that no longer built -- or that installed a
    # different dependency set than CI -- would have been found by whoever next
    # ran `--profile cube up`, which is to say by hand.
    #
    # It runs the suite again inside the container rather than trusting the
    # matching versions: the image is the only environment the compose profile
    # ever uses, and "the tests pass on a runner" is not the same claim.
    name: python / cube image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t tde-cube:ci python/transit-cube
      - name: Atoti is importable
        run: docker run --rm tde-cube:ci
      - name: Tests, inside the image
        # Read-only, exactly as compose mounts it, so a test that writes into
        # the repo fails here rather than after it has already done so.
        # /tmp is the fixture and Atoti scratch space.
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app/python/transit-cube \
            tde-cube:ci python -m pytest -q -p no:cacheprovider

  infra:
    name: infra / broker round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml up -d --wait redpanda
      - name: Create topics
        run: docker compose -f infra/docker-compose.yml up topic-init
      - name: Produce and consume
        run: bash infra/scripts/smoke-test.sh
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
