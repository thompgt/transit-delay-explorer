name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust / transit-ingest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Tests load the checked-in config/agencies.toml, so a typo there fails
      # here rather than midway through a run.
      - run: cargo test --all-features

  java:
    name: java / transit-stream
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/transit-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn -B verify

  python:
    name: python / transit-cube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/transit-cube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Atoti Community Edition does not support 3.13.
          python-version: '3.11'
      # The cube tests cover the pure calendar logic and need no Atoti session,
      # so CI installs only the dev extras rather than pulling the JVM-backed
      # Atoti distribution on every run.
      - run: pip install pytest ruff
      - run: ruff check src tests
      - run: python -m pytest -q

  infra:
    name: infra / broker round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml up -d --wait redpanda
      - name: Create topics
        run: docker compose -f infra/docker-compose.yml up topic-init
      - name: Produce and consume
        run: bash infra/scripts/smoke-test.sh
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
